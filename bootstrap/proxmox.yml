---
- name: Install Proxmox VE 9 on a prepared Debian 13 host
  hosts: debian_bootstrap
  become: true
  gather_facts: true
  vars:
    pve_bootstrap_hostname: pve
    pve_bootstrap_domain: home.arpa
    pve_bootstrap_management_ip: ''
  tasks:
    - name: Confirm Debian 13
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
          - pve_bootstrap_management_ip | length > 0
        fail_msg: Set management IP and confirm Debian 13 before bootstrapping.
    - name: Require hostname already configured by Debian installer
      ansible.builtin.assert:
        that: ansible_facts.hostname == pve_bootstrap_hostname
    - name: Ensure FQDN resolves to management address
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^{{ pve_bootstrap_management_ip | regex_escape }}\\s'
        line: "{{ pve_bootstrap_management_ip }} {{ pve_bootstrap_hostname }}.{{ pve_bootstrap_domain }} {{ pve_bootstrap_hostname }}"
        state: present
    - name: Install APT prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, sudo]
        state: present
        update_cache: true
    - name: Install Proxmox archive signing key
      ansible.builtin.get_url:
        url: https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
        dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
        mode: '0644'
    - name: Enable PVE 9 no-subscription repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-no-subscription.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pve
          Suites: trixie
          Components: pve-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    - name: Install Proxmox kernel first
      ansible.builtin.apt:
        name: proxmox-default-kernel
        state: present
        update_cache: true
    - name: Determine active kernel
      ansible.builtin.command: uname -r
      register: pve_running_kernel
      changed_when: false
    - name: Stop until rebooted into Proxmox kernel
      ansible.builtin.assert:
        that: "'pve' in pve_running_kernel.stdout"
        fail_msg: "Kernel installed. Reboot manually and rerun task bootstrap:apply; no automatic reboot."
    - name: Install Proxmox VE 9
      ansible.builtin.apt:
        name: [proxmox-ve, postfix, open-iscsi, ifupdown2, zfsutils-linux, chrony, smartmontools, nvme-cli, nfs-common]
        state: present
        update_cache: true
    - name: Ensure Proxmox proxy is enabled
      ansible.builtin.service:
        name: pveproxy
        enabled: true
        state: started
