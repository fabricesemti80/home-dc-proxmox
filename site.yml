---
- name: Configure standalone Proxmox VE host
  hosts: pve
  become: true
  gather_facts: true
  pre_tasks:
    - name: Require the installed Proxmox VE 9 host
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Debian'
          - ansible_facts['distribution_major_version'] == '13'
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: This configuration targets the installed Proxmox VE 9 host (Debian 13).
      tags: always

  roles:
    - role: proxmox_updates
      tags: updates
    - role: proxmox_storage
      tags: storage
    - role: proxmox_nfs
      tags: nfs
    - role: proxmox_gpu_passthrough
      tags: [gpu, passthrough]
    - role: proxmox_mail
      tags: mail
