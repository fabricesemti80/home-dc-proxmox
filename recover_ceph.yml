---
- name: Recover existing Ceph daemons one host at a time
  hosts: pve01
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    ceph_node: "{{ inventory_hostname.split('.')[0] }}"
    ceph_osd_ids: {pve-0: '0', pve-1: '1', pve-2: '2'}
    ceph_daemons:
      - {kind: mon, id: "{{ ceph_node }}"}
      - {kind: mgr, id: "{{ ceph_node }}"}
      - {kind: mds, id: "{{ ceph_node }}"}
      - {kind: osd, id: "{{ ceph_osd_ids[ceph_node] }}"}
  tasks:
    - name: Require real execution against the full existing cluster
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - ansible_play_hosts_all | sort == groups['pve01'] | sort
          - groups['pve01'] | length == 3
          - ceph_node in ceph_osd_ids
        fail_msg: Use the full pve01 inventory without --limit or --check.

    - name: Read existing cluster identity and quorum
      ansible.builtin.command: ceph quorum_status --format json
      register: ceph_quorum
      changed_when: false

    - name: Require this cluster and existing monitor quorum
      ansible.builtin.assert:
        that:
          - (ceph_quorum.stdout | from_json).monmap.fsid == 'a74bdf84-c6e5-4a3c-acf2-6c307f5c15a4'
          - (ceph_quorum.stdout | from_json).quorum | length >= 2

    - name: Check existing daemon directories
      ansible.builtin.stat:
        path: "/var/lib/ceph/{{ item.kind }}/ceph-{{ item.id }}"
      loop: "{{ ceph_daemons }}"
      register: ceph_directories

    - name: Refuse to create missing daemons
      ansible.builtin.assert:
        that: item.stat.isdir | default(false)
        quiet: true
      loop: "{{ ceph_directories.results }}"
      loop_control:
        label: "{{ item.item.kind }}.{{ item.item.id }}"

    - name: Fetch existing daemon authentication records
      ansible.builtin.command:
        argv: [ceph, auth, get, "{{ item.kind }}.{{ item.id }}"]
      loop: "{{ ceph_daemons | rejectattr('kind', 'equalto', 'mon') | list }}"
      register: ceph_keys
      changed_when: false
      no_log: true

    - name: Restore daemon keyrings with server-side backups
      ansible.builtin.copy:
        content: "{{ item.stdout }}\n"
        dest: "/var/lib/ceph/{{ item.item.kind }}/ceph-{{ item.item.id }}/keyring"
        owner: ceph
        group: ceph
        mode: '0600'
        backup: true
      loop: "{{ ceph_keys.results }}"
      register: ceph_keyrings
      no_log: true
      diff: false

    - name: Repair persistent OSD key only when its label differs
      ansible.builtin.script:
        cmd: "hack/ceph-osd-key.py {{ ceph_osd_ids[ceph_node] }}"
        executable: /usr/bin/python3
      register: ceph_label
      changed_when: "'changed' in ceph_label.stdout"

    - name: Enable and start all daemon targets
      ansible.builtin.systemd_service:
        name: "ceph-{{ item }}.target"
        enabled: true
        state: started
      loop: [mon, mgr, mds, osd]

    - name: Enable and start the existing monitor
      ansible.builtin.systemd_service:
        name: "ceph-mon@{{ ceph_node }}"
        enabled: true
        state: started

    - name: Start daemons and restart only changed keyrings
      ansible.builtin.systemd_service:
        name: "ceph-{{ item.item.item.kind }}@{{ item.item.item.id }}"
        enabled: true
        state: "{{ 'restarted' if item.changed else 'started' }}"
      loop: "{{ ceph_keyrings.results }}"
      no_log: true

    - name: Wait for this OSD to be up before returning it to placement
      ansible.builtin.command: ceph osd dump --format json
      register: ceph_osds
      changed_when: false
      until: >-
        (ceph_osds.stdout | from_json).osds
        | selectattr('osd', 'equalto', ceph_osd_ids[ceph_node] | int)
        | selectattr('up', 'equalto', 1) | list | length == 1
      retries: 30
      delay: 5

    - name: Return the recovered OSD to placement if it is out
      ansible.builtin.command:
        argv: [ceph, osd, in, "{{ ceph_osd_ids[ceph_node] }}"]
      when: >-
        (ceph_osds.stdout | from_json).osds
        | selectattr('osd', 'equalto', ceph_osd_ids[ceph_node] | int)
        | selectattr('in', 'equalto', 0) | list | length == 1

    - name: Wait for clean PGs before proceeding to another host
      ansible.builtin.command: ceph pg stat --format json
      register: ceph_host_pgs
      changed_when: false
      until: >-
        (ceph_host_pgs.stdout | from_json).pg_summary.num_pg_by_state
        | rejectattr('name', 'equalto', 'active+clean') | list | length == 0
      retries: 180
      delay: 10

- name: Verify full cluster recovery and restore shared storage credentials
  hosts: pve01
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Read authoritative existing Proxmox client key
      ansible.builtin.command: ceph auth get-key client.admin
      register: ceph_storage_secret
      changed_when: false
      run_once: true
      no_log: true

    - name: Restore shared CephFS secret without rotating it
      ansible.builtin.copy:
        content: "{{ ceph_storage_secret.stdout | trim }}\n"
        dest: /etc/pve/priv/ceph/ceph-proxmox-fs.secret
        owner: root
        group: www-data
        mode: '0600'
        backup: true
      run_once: true
      no_log: true
      diff: false

    - name: Read authoritative existing Proxmox client keyring
      ansible.builtin.command: ceph auth get client.admin
      register: ceph_storage_keyring
      changed_when: false
      run_once: true
      no_log: true

    - name: Restore shared RBD keyring without rotating it
      ansible.builtin.copy:
        content: "{{ ceph_storage_keyring.stdout }}\n"
        dest: /etc/pve/priv/ceph/ceph-proxmox-rbd.keyring
        owner: root
        group: www-data
        mode: '0600'
        backup: true
      run_once: true
      no_log: true
      diff: false

    - name: Wait for all expected daemons and clean placement groups
      ansible.builtin.script:
        cmd: hack/check-ceph-recovery.py
        executable: /usr/bin/python3
      register: ceph_recovery
      changed_when: false
      until: ceph_recovery.rc == 0
      retries: 180
      delay: 10
      run_once: true

    - name: Wait for Proxmox Ceph storage access on every host
      ansible.builtin.command: "pvesm status --storage {{ item }}"
      loop: [ceph-proxmox-fs, ceph-proxmox-rbd]
      register: ceph_storage
      changed_when: false
      until: ceph_storage.rc == 0 and ceph_storage.stdout is search(item ~ '\s+\S+\s+active\s+')
      retries: 12
      delay: 5

    - name: Show verified cluster status
      ansible.builtin.command: ceph -s
      register: ceph_final
      changed_when: false
      run_once: true

    - name: Report recovery result
      ansible.builtin.debug:
        var: ceph_final.stdout_lines
      run_once: true
