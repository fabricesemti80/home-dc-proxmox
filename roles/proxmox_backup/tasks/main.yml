---
- name: Check PBS storage
  ansible.builtin.command: pvesm status --storage {{ pbs_storage.name }}
  register: pbs_storage_status
  changed_when: false
  failed_when: false
  run_once: true
  when: pbs_storage.enabled | default(false)

- name: Add PBS storage
  ansible.builtin.command: >-
    pvesm add pbs {{ pbs_storage.name }}
    --server {{ pbs_storage.server }}
    --datastore {{ pbs_storage.datastore }}
    --username {{ pbs_storage.username }}
    --password {{ pbs_storage.password }}
    --fingerprint {{ pbs_storage.fingerprint }}
    --content backup
  no_log: true
  run_once: true
  when:
    - pbs_storage.enabled | default(false)
    - pbs_storage_status.rc != 0

- name: Check PBS backup pools
  ansible.builtin.command: pvesh get /pools --poolid {{ item.pool }} --output-format json
  register: pbs_backup_pool_status
  changed_when: false
  failed_when: false
  run_once: true
  loop: "{{ pbs_backup_jobs | default([]) }}"
  loop_control:
    label: "{{ item.pool }}"

- name: Create PBS backup pools
  ansible.builtin.command: >-
    pvesh create /pools
    --poolid {{ item.item.pool }}
    --comment "Empty placeholder pool for {{ item.item.id }}"
  run_once: true
  loop: "{{ pbs_backup_pool_status.results | default([]) }}"
  loop_control:
    label: "{{ item.item.pool }}"
  when: item.rc != 0

- name: Check PBS backup jobs
  ansible.builtin.command: pvesh get /cluster/backup/{{ item.id }} --output-format json
  register: pbs_backup_job_status
  changed_when: false
  failed_when: false
  run_once: true
  loop: "{{ pbs_backup_jobs | default([]) }}"
  loop_control:
    label: "{{ item.id }}"

- name: Configure PBS backup jobs
  ansible.builtin.command: >-
    pvesh {{ 'set' if item.rc == 0 else 'create' }}
    {{ '/cluster/backup/' ~ item.item.id if item.rc == 0 else '/cluster/backup' }}
    {% if item.rc != 0 %}--id {{ item.item.id }}{% endif %}
    --pool {{ item.item.pool }}
    --storage {{ pbs_storage.name }}
    --schedule "{{ item.item.schedule }}"
    --mode {{ item.item.mode }}
    --enabled {{ item.item.enabled | int }}
    --compress zstd
    --prune-backups {{ item.item.prune_backups }}
    --mailnotification failure
    --ionice {{ backup_global.ionice }}
    --lockwait {{ backup_global.lockwait }}
  changed_when: item.rc != 0
  run_once: true
  loop: "{{ pbs_backup_job_status.results | default([]) }}"
  loop_control:
    label: "{{ item.item.id }}"
  when: pbs_storage.enabled | default(false)
