---
# Kestra owns maintenance; retain cleanup so site.yml cannot reinstall the old job.
- name: Remove legacy weekly Ceph restart cron
  ansible.builtin.cron:
    name: "{{ proxmox_ceph_maintenance_cron_name }}"
    user: root
    state: absent

- name: Remove legacy Ceph maintenance executable
  ansible.builtin.file:
    path: "{{ proxmox_ceph_maintenance_script }}"
    state: absent
