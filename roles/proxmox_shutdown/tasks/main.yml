---
- name: Read registered Proxmox guests
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - /cluster/resources
      - --type
      - vm
      - --output-format
      - json
  register: proxmox_shutdown_guest_inventory
  changed_when: false
  check_mode: false

- name: Select registered VMs and containers
  ansible.builtin.set_fact:
    proxmox_shutdown_guests: >-
      {{ proxmox_shutdown_guest_inventory.stdout | from_json
         | selectattr('type', 'in', ['qemu', 'lxc']) | list }}

- name: Report guests discovered for shutdown
  ansible.builtin.debug:
    msg: >-
      Registered guests discovered: {{ proxmox_shutdown_guests | map(attribute='id') | list }}.
      Proxmox will stop guests serially; poweroff requires each guest's live status
      to be stopped.

- name: Read live status of each discovered guest
  ansible.builtin.command:
    argv:
      - "{{ 'qm' if item.type == 'qemu' else 'pct' }}"
      - status
      - "{{ item.vmid | string }}"
      - --verbose
  register: proxmox_shutdown_initial_live_status
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_shutdown_guests }}"
  loop_control:
    label: "{{ item.type }}/{{ item.vmid }}"

- name: Report live guest states
  ansible.builtin.debug:
    msg: "{{ item.item.id }}: {{ item.stdout_lines | select('match', '^(qmp)?status:') | list | join(', ') }}"
  loop: "{{ proxmox_shutdown_initial_live_status.results }}"
  loop_control:
    label: "{{ item.item.id }}"

- name: Gracefully stop all Proxmox VMs and containers
  ansible.builtin.command:
    argv:
      - pvenode
      - stopall
      - --timeout
      - "{{ proxmox_shutdown_timeout | string }}"
      - --force-stop
      - "0"
      - --max-workers
      - "1"
  when:
    - not ansible_check_mode
    - proxmox_shutdown_guests | length > 0

- name: Rediscover registered guests before checking live status
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - /cluster/resources
      - --type
      - vm
      - --output-format
      - json
  register: proxmox_shutdown_final_inventory
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Wait for each guest's live status to be explicitly stopped
  ansible.builtin.command:
    argv:
      - "{{ 'qm' if item.type == 'qemu' else 'pct' }}"
      - status
      - "{{ item.vmid | string }}"
      - --verbose
  register: proxmox_shutdown_live_status
  changed_when: false
  check_mode: false
  loop: "{{ proxmox_shutdown_final_inventory.stdout | from_json | selectattr('type', 'in', ['qemu', 'lxc']) | list }}"
  loop_control:
    label: "{{ item.type }}/{{ item.vmid }}"
  until: "'status: stopped' in proxmox_shutdown_live_status.stdout_lines"
  retries: "{{ proxmox_shutdown_status_retries }}"
  delay: "{{ proxmox_shutdown_status_poll_interval }}"
  when: not ansible_check_mode

- name: Power off the Proxmox host
  ansible.builtin.command:
    argv:
      - systemctl
      - poweroff
  async: 1
  poll: 0
  changed_when: true
  when: not ansible_check_mode
