---
- name: "========== ROLE: GPU PASSTHROUGH =========="
  ansible.builtin.debug:
    msg: "P2000 VFIO binding; GT 710 stays on the host"

- name: Inspect selected GPU PCI functions
  ansible.builtin.command: "lspci -nns {{ item.address }}"
  loop: "{{ proxmox_gpu_devices }}"
  register: gpu_pci_devices
  changed_when: false
  check_mode: false

- name: Refuse passthrough if hardware differs from the inventory
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - "('[%s]' | format(item.item.id)) in item.stdout"
    fail_msg: "PCI device {{ item.item.address }} is not {{ item.item.id }}; refusing to alter GPU bindings."
  loop: "{{ gpu_pci_devices.results }}"

- name: Read firmware primary display selection
  ansible.builtin.slurp:
    src: /sys/bus/pci/devices/0000:02:00.0/boot_vga
  register: console_boot_vga
  check_mode: false

- name: Require GT 710 as firmware primary display before applying passthrough
  ansible.builtin.assert:
    that: (console_boot_vga.content | b64decode | trim) == '1'
    fail_msg: Set GT 710 as primary display in BIOS and reboot before applying P2000 passthrough.

- name: Check systemd-boot kernel command line
  ansible.builtin.stat:
    path: /etc/kernel/cmdline
  register: kernel_cmdline

- name: Enable Intel IOMMU on systemd-boot installations
  ansible.builtin.replace:
    path: /etc/kernel/cmdline
    regexp: '^(?!.*intel_iommu=on)(.*\S)(\s*)$'
    replace: '\1 intel_iommu=on\2'
  when: kernel_cmdline.stat.exists
  notify: Refresh Proxmox boot entries

- name: Enable Intel IOMMU on GRUB installations
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="(?![^"]*intel_iommu=on)[^"\n]*)(")$'
    replace: '\1 intel_iommu=on\2'
  when: not kernel_cmdline.stat.exists
  notify: Refresh GRUB configuration

- name: Load VFIO early without blacklisting the console GPU driver
  ansible.builtin.copy:
    dest: /etc/modules-load.d/p2000-vfio.conf
    mode: '0644'
    content: |
      vfio
      vfio_pci
      vfio_iommu_type1
  notify: Refresh initramfs

- name: Bind only P2000 graphics and audio PCI IDs to vfio-pci
  ansible.builtin.copy:
    dest: /etc/modprobe.d/p2000-vfio.conf
    mode: '0644'
    content: "options vfio-pci ids={{ proxmox_gpu_devices | map(attribute='id') | join(',') }}\nsoftdep nouveau pre: vfio-pci\nsoftdep snd_hda_intel pre: vfio-pci\n"
  notify: Refresh initramfs
