---
- name: Inspect HDD identity
  ansible.builtin.command: "lsblk -dn -o SERIAL {{ proxmox_storage_slow_disk }}"
  register: slow_disk_serial
  changed_when: false
  check_mode: false

- name: Refuse to use another disk
  ansible.builtin.assert:
    that:
      - slow_disk_serial.rc == 0
      - slow_disk_serial.stdout | trim == proxmox_storage_slow_disk_serial
    fail_msg: The slow-pool disk is not the expected HGST HDD; refusing to erase it.

- name: Check if slow pool already exists
  ansible.builtin.command: "zpool list -H -o name {{ proxmox_storage_slow_pool }}"
  register: slow_pool_status
  failed_when: false
  changed_when: false
  check_mode: false

- name: Inspect existing slow pool membership
  ansible.builtin.command: "zpool status -P {{ proxmox_storage_slow_pool }}"
  register: slow_pool_members
  changed_when: false
  check_mode: false
  when: slow_pool_status.rc == 0

- name: Verify existing pool uses the intended HDD
  ansible.builtin.assert:
    that: "proxmox_storage_slow_disk in slow_pool_members.stdout"
    fail_msg: The existing slow pool uses a different disk; refusing to register it.
  when: slow_pool_status.rc == 0

- name: Inspect HDD mounts before creating pool
  ansible.builtin.command: "lsblk -nr -o MOUNTPOINT {{ proxmox_storage_slow_disk }}"
  register: slow_disk_mounts
  changed_when: false
  check_mode: false
  when: slow_pool_status.rc != 0

- name: Refuse to erase a mounted disk
  ansible.builtin.assert:
    that: slow_disk_mounts.stdout | trim == ''
    fail_msg: The HDD or one of its partitions is mounted; refusing to erase it.
  when: slow_pool_status.rc != 0

- name: Create single-disk ZFS slow pool (erases HDD partitions)
  ansible.builtin.command: "zpool create -f -o ashift=12 {{ proxmox_storage_slow_pool }} {{ proxmox_storage_slow_disk }}"
  when:
    - slow_pool_status.rc != 0
    - not ansible_check_mode

- name: Read Proxmox storage definitions before renaming storage IDs
  ansible.builtin.slurp:
    src: /etc/pve/storage.cfg
  register: proxmox_storage_config
  check_mode: false

- name: Configure descriptive ZFS storage IDs
  ansible.builtin.include_tasks: zfs_storage.yml
  loop: "{{ proxmox_storage_zfs }}"
  loop_control:
    loop_var: zfs_storage
