---
- name: "========== ROLE: UPDATES =========="
  ansible.builtin.debug:
    msg: "APT repositories and package upgrades"

- name: Disable subscription-only Proxmox repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
    state: absent

- name: Disable unused subscription-only Ceph repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/ceph.sources
    state: absent

- name: Configure official Proxmox no-subscription repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.sources
    mode: '0644'
    content: |
      Types: deb
      URIs: {{ proxmox_updates_repository_url }}
      Suites: {{ proxmox_updates_suite }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

- name: Upgrade installed packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
