---
- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload
  changed_when: true
  notify: Apply udev rules to passthrough disks

# A reload does not touch existing devices; replay a change event only for block devices carrying the assigned serials
# (the disks and their partitions), the same key the rule matches on.
- name: Apply udev rules to passthrough disks
  ansible.builtin.command:
    argv: "{{ ['udevadm', 'trigger', '--action=change', '--subsystem-match=block'] + (proxmox_ssd_passthrough_disks | map(attribute='serial') | map('regex_replace', '^(.*)$', '--property-match=ID_SERIAL_SHORT=\\1') | list) }}"
  changed_when: true
  when: not ansible_check_mode
  notify: Wait for udev to settle

- name: Wait for udev to settle
  ansible.builtin.command: udevadm settle --timeout=30
  changed_when: false
  when: not ansible_check_mode
