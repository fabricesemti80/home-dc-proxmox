---
- name: "========== ROLE: TERRAFORM CREDENTIALS =========="
  ansible.builtin.debug:
    msg: "Provision the single-host Terraform administrator and store its API token in Doppler"

- name: Inspect Proxmox API users
  ansible.builtin.command: pveum user list --output-format json
  register: terraform_users
  changed_when: false
  check_mode: false

- name: Inspect Terraform API tokens when user exists
  ansible.builtin.command: "pveum user token list {{ proxmox_terraform_user }} --output-format json"
  register: terraform_tokens
  changed_when: false
  check_mode: false
  when: proxmox_terraform_user in (terraform_users.stdout | from_json | map(attribute='userid') | list)

- name: Inspect Proxmox permissions
  ansible.builtin.command: pveum acl list --output-format json
  register: terraform_acls
  changed_when: false
  check_mode: false

# All controller-side Doppler calls use the Keychain-backed, config-scoped service token.
# A read-only token can plan, but creation also needs write access to the config.
# Precondition: PROXMOX_TOKEN_ID and PROXMOX_TOKEN_SECRET must already be seeded when the
# host token exists, otherwise the partial-state check below refuses to proceed.
- name: Inspect Doppler config for stored Terraform credentials
  ansible.builtin.command:
    argv: [doppler, secrets, --only-names, --json, --project, "{{ proxmox_terraform_doppler_project }}", --config, "{{ proxmox_terraform_doppler_config }}", --no-check-version]
  delegate_to: localhost
  become: false
  environment:
    DOPPLER_TOKEN: "{{ proxmox_terraform_doppler_token }}"
  register: terraform_doppler_names
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Require access to the Doppler config
  ansible.builtin.assert:
    that: terraform_doppler_names.rc | default(1) == 0
    fail_msg: Store the home-dc-proxmox/prd service token with task doppler-token-save, or supply DOPPLER_TOKEN, then retry.

- name: Locate stored and host Terraform credentials
  ansible.builtin.set_fact:
    terraform_stored_names: "{{ (terraform_doppler_names.stdout | from_json).keys() | select('in', [proxmox_terraform_doppler_id_name, proxmox_terraform_doppler_secret_name]) | list }}"
    terraform_token_present: "{{ proxmox_terraform_token_id in (terraform_tokens.stdout | default('[]') | from_json | map(attribute='tokenid') | list) }}"
  no_log: true

- name: Refuse ambiguous or partially provisioned Terraform credentials
  ansible.builtin.assert:
    that:
      - terraform_stored_names | length in [0, 2]
      - (terraform_stored_names | length == 2) == (terraform_token_present | bool)
    fail_msg: Terraform token and both Doppler secrets (PROXMOX_TOKEN_ID and PROXMOX_TOKEN_SECRET) must all exist or all be absent. Reconcile manually; this role never rotates an unknown token.

- name: Refuse a disabled Terraform user or expired API token
  ansible.builtin.assert:
    that:
      - "(terraform_users.stdout | from_json | selectattr('userid', 'equalto', proxmox_terraform_user) | first).enable | int == 1"
      - "(terraform_tokens.stdout | from_json | selectattr('tokenid', 'equalto', proxmox_terraform_token_id) | first).expire | int > ansible_facts['date_time']['epoch'] | int"
    fail_msg: Terraform account is disabled or its token has expired; rotate intentionally rather than silently reusing it.
  when: terraform_token_present | bool

- name: Read stored Terraform credential without printing it
  ansible.builtin.command:
    argv: [doppler, secrets, get, "{{ proxmox_terraform_doppler_id_name }}", "{{ proxmox_terraform_doppler_secret_name }}", --json, --project, "{{ proxmox_terraform_doppler_project }}", --config, "{{ proxmox_terraform_doppler_config }}", --no-check-version]
  delegate_to: localhost
  become: false
  environment:
    DOPPLER_TOKEN: "{{ proxmox_terraform_doppler_token }}"
  register: terraform_existing_secrets
  changed_when: false
  check_mode: false
  no_log: true
  when: terraform_stored_names | length == 2

- name: Verify stored Terraform credential has the expected identity and a secret
  ansible.builtin.assert:
    that:
      - "(terraform_existing_secrets.stdout | from_json)[proxmox_terraform_doppler_id_name].computed == proxmox_terraform_user ~ '!' ~ proxmox_terraform_token_id"
      - "(terraform_existing_secrets.stdout | from_json)[proxmox_terraform_doppler_secret_name].computed | length > 0"
    fail_msg: Stored Terraform credential is incomplete or for another token; refusing to replace it.
  no_log: true
  when: terraform_stored_names | length == 2

- name: Confirm Doppler service-token identity before creating a token
  ansible.builtin.command:
    argv: [doppler, me, --json, --no-check-version]
  delegate_to: localhost
  become: false
  environment:
    DOPPLER_TOKEN: "{{ proxmox_terraform_doppler_token }}"
  register: terraform_service_identity
  changed_when: false
  no_log: true
  when:
    - not ansible_check_mode
    - not terraform_token_present | bool

- name: Refuse token creation without a Doppler service token
  ansible.builtin.assert:
    that: (terraform_service_identity.stdout | from_json).type == 'service_token'
    fail_msg: Save a read/write home-dc-proxmox/prd service token with task doppler-token-save before applying. Personal and CLI tokens are refused.
  when:
    - not ansible_check_mode
    - not terraform_token_present | bool

- name: Create dedicated Proxmox Terraform user
  ansible.builtin.command:
    argv: [pveum, user, add, "{{ proxmox_terraform_user }}", --comment, "Terraform automation for pve-00 (API token only)"]
  when:
    - not ansible_check_mode
    - proxmox_terraform_user not in (terraform_users.stdout | from_json | map(attribute='userid') | list)

- name: Grant full Proxmox administrative access to Terraform user
  ansible.builtin.command:
    argv: [pveum, acl, modify, /, --users, "{{ proxmox_terraform_user }}", --roles, "{{ proxmox_terraform_role }}"]
  when:
    - not ansible_check_mode
    - terraform_acls.stdout | from_json | selectattr('path', 'equalto', '/') | selectattr('ugid', 'equalto', proxmox_terraform_user) | selectattr('roleid', 'equalto', proxmox_terraform_role) | list | length == 0

- name: Restore Terraform token administrator ACL when already provisioned
  ansible.builtin.command:
    argv: [pveum, acl, modify, /, --tokens, "{{ proxmox_terraform_user }}!{{ proxmox_terraform_token_id }}", --roles, "{{ proxmox_terraform_role }}"]
  when:
    - not ansible_check_mode
    - terraform_token_present | bool
    - terraform_acls.stdout | from_json | selectattr('path', 'equalto', '/') | selectattr('ugid', 'equalto', proxmox_terraform_user ~ '!' ~ proxmox_terraform_token_id) | selectattr('roleid', 'equalto', proxmox_terraform_role) | list | length == 0

- name: Create and store Terraform API token atomically where possible
  when:
    - not ansible_check_mode
    - not terraform_token_present | bool
  block:
    - name: Create privilege-separated Terraform API token
      ansible.builtin.command:
        argv: [pveum, user, token, add, "{{ proxmox_terraform_user }}", "{{ proxmox_terraform_token_id }}", --privsep, '1', --expire, "{{ ansible_facts['date_time']['epoch'] | int + proxmox_terraform_token_validity_seconds }}", --output-format, json]
      register: terraform_new_token
      no_log: true

    - name: Grant Terraform token full host administrator ACL
      ansible.builtin.command:
        argv: [pveum, acl, modify, /, --tokens, "{{ proxmox_terraform_user }}!{{ proxmox_terraform_token_id }}", --roles, "{{ proxmox_terraform_role }}"]

    - name: Store Terraform token secret in Doppler
      ansible.builtin.command:
        argv: [doppler, secrets, set, "{{ proxmox_terraform_doppler_secret_name }}", --project, "{{ proxmox_terraform_doppler_project }}", --config, "{{ proxmox_terraform_doppler_config }}", --no-interactive, --no-check-version]
        stdin: "{{ (terraform_new_token.stdout | from_json).value }}"
        stdin_add_newline: false
      delegate_to: localhost
      become: false
      environment:
        DOPPLER_TOKEN: "{{ proxmox_terraform_doppler_token }}"
      no_log: true

    - name: Store Terraform token identifier in Doppler
      ansible.builtin.command:
        argv: [doppler, secrets, set, "{{ proxmox_terraform_doppler_id_name }}", --project, "{{ proxmox_terraform_doppler_project }}", --config, "{{ proxmox_terraform_doppler_config }}", --no-interactive, --no-check-version]
        stdin: "{{ proxmox_terraform_user }}!{{ proxmox_terraform_token_id }}"
        stdin_add_newline: false
      delegate_to: localhost
      become: false
      environment:
        DOPPLER_TOKEN: "{{ proxmox_terraform_doppler_token }}"
      no_log: true

  rescue:
    - name: Check which credential parts were stored despite an interrupted write
      ansible.builtin.command:
        argv: [doppler, secrets, --only-names, --json, --project, "{{ proxmox_terraform_doppler_project }}", --config, "{{ proxmox_terraform_doppler_config }}", --no-check-version]
      delegate_to: localhost
      become: false
      environment:
        DOPPLER_TOKEN: "{{ proxmox_terraform_doppler_token }}"
      register: terraform_recovery_names
      changed_when: false
      failed_when: false
      no_log: true

    # A listing failure is ambiguous, so nothing is revoked. Both parts present means the
    # credential is stored and must not be revoked. Anything less is an unstored credential.
    - name: Classify stored credential parts after the failure
      ansible.builtin.set_fact:
        terraform_recovery_stored: "{{ ((terraform_recovery_names.stdout | from_json).keys() | select('in', [proxmox_terraform_doppler_id_name, proxmox_terraform_doppler_secret_name]) | list) if terraform_recovery_names.rc == 0 else none }}"
      no_log: true

    - name: Remove a partially stored credential
      ansible.builtin.command:
        argv: [doppler, secrets, delete, "{{ item }}", --project, "{{ proxmox_terraform_doppler_project }}", --config, "{{ proxmox_terraform_doppler_config }}", --yes, --no-check-version]
      delegate_to: localhost
      become: false
      environment:
        DOPPLER_TOKEN: "{{ proxmox_terraform_doppler_token }}"
      loop: "{{ terraform_recovery_stored or [] }}"
      when:
        - terraform_new_token is defined
        - terraform_new_token is succeeded
        - terraform_recovery_stored is not none
        - terraform_recovery_stored | length < 2
      failed_when: false
      no_log: true

    - name: Remove token ACL before revoking an unstored credential
      ansible.builtin.command:
        argv: [pveum, acl, delete, /, --tokens, "{{ proxmox_terraform_user }}!{{ proxmox_terraform_token_id }}", --roles, "{{ proxmox_terraform_role }}"]
      when:
        - terraform_new_token is defined
        - terraform_new_token is succeeded
        - terraform_recovery_stored is not none
        - terraform_recovery_stored | length < 2
      failed_when: false

    - name: Revoke unstored Terraform token if Doppler write failed
      ansible.builtin.command:
        argv: [pveum, user, token, delete, "{{ proxmox_terraform_user }}", "{{ proxmox_terraform_token_id }}"]
      when:
        - terraform_new_token is defined
        - terraform_new_token is succeeded
        - terraform_recovery_stored is not none
        - terraform_recovery_stored | length < 2
      no_log: true

    - name: Stop after unsuccessful credential provisioning
      ansible.builtin.fail:
        msg: Terraform token provisioning did not complete. Inspect token and Doppler secret presence before retrying; a token is never rotated automatically.

- name: Explain check-mode token creation
  ansible.builtin.debug:
    msg: "Check mode: the next task apply will create and store the Terraform token in Doppler; first save a read/write home-dc-proxmox/prd service token with task doppler-token-save."
  when:
    - ansible_check_mode
    - not terraform_token_present | bool
