version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  doppler-token-save:
    desc: Securely add or replace the home-dc-proxmox/prd Doppler service token in macOS Keychain
    cmds:
      - python3 scripts/save-doppler-token.py

  plan:
    desc: Preview standalone PVE host configuration without applying it
    cmds:
      - ansible-playbook -i inventory site.yml --check --diff
  nfs-plan:
    desc: Preview only NFS storage configuration changes
    cmds:
      - ansible-playbook -i inventory site.yml --check --diff --tags nfs

  nfs-apply:
    desc: Apply only NFS storage configuration changes
    cmds:
      - ansible-playbook -i inventory site.yml --tags nfs

  monitoring-credentials-plan:
    desc: Preview the read-only PVE monitoring credential without creating a token
    cmds:
      - ansible-playbook -i inventory site.yml --check --diff --tags monitoring-credentials

  monitoring-credentials-apply:
    desc: Provision the read-only PVE monitoring credential and store it in Doppler
    cmds:
      - ansible-playbook -i inventory site.yml --tags monitoring-credentials


  apply:
    desc: Apply standalone PVE host configuration (operator initiated)
    cmds:
      - ansible-playbook -i inventory site.yml

  reboot:
    desc: Reboot standalone host and wait for Proxmox and SSH to return
    cmds:
      - ansible-playbook -i inventory reboot.yml
