version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  packages-plan:
    desc: Preview host utility package installation
    cmds:
      - ansible-playbook -i inventory site.yml --check --diff --tags packages

  packages-apply:
    desc: Install configured host utility packages
    cmds:
      - ansible-playbook -i inventory site.yml --tags packages

  wireless-regulatory-plan:
    desc: Preview optional wireless regulatory configuration
    cmds:
      - ansible-playbook -i inventory site.yml --check --diff --tags wireless-regulatory

  wireless-regulatory-apply:
    desc: Apply optional wireless regulatory configuration
    cmds:
      - ansible-playbook -i inventory site.yml --tags wireless-regulatory

  doppler-token-save:
    desc: Securely add or replace the home-dc-proxmox/prd Doppler service token in macOS Keychain
    cmds:
      - python3 scripts/save-doppler-token.py

  plan:
    desc: Preview standalone PVE host configuration without applying it
    cmds:
      - ansible-playbook -i inventory site.yml --check --diff
  nfs-plan:
    desc: Preview only NFS storage configuration changes
    cmds:
      - ansible-playbook -i inventory site.yml --check --diff --tags nfs

  nfs-apply:
    desc: Apply only NFS storage configuration changes
    cmds:
      - ansible-playbook -i inventory site.yml --tags nfs

  monitoring-credentials-plan:
    desc: Preview the read-only PVE monitoring credential without creating a token
    cmds:
      - ansible-playbook -i inventory site.yml --check --diff --tags monitoring-credentials

  monitoring-credentials-apply:
    desc: Provision the read-only PVE monitoring credential and store it in Doppler
    cmds:
      - ansible-playbook -i inventory site.yml --tags monitoring-credentials

  hardware-monitoring-plan:
    desc: Preview the authenticated PVE host metrics exporter
    cmds:
      - ansible-playbook -i inventory site.yml --check --diff --tags hardware-monitoring

  hardware-monitoring-apply:
    desc: Install and configure the authenticated PVE host metrics exporter
    cmds:
      - ansible-playbook -i inventory site.yml --tags hardware-monitoring


  ssd-passthrough-plan:
    desc: Preview SSD passthrough host preparation (guards run read-only; wipe stays off)
    cmds:
      - ansible-playbook -i inventory site.yml --check --diff --tags ssd-passthrough

  ssd-passthrough-apply:
    desc: Apply SSD passthrough host preparation (wipe only with `-- -e proxmox_ssd_passthrough_wipe_signatures=true`)
    cmds:
      - ansible-playbook -i inventory site.yml --tags ssd-passthrough {{.CLI_ARGS}}

  hardware-notes-plan:
    desc: Preview the SSH banner and datacenter Notes generated from host hardware
    cmds:
      - ansible-playbook -i inventory site.yml --check --diff --tags hardware-notes

  hardware-notes-apply:
    desc: Write the hardware summary to the SSH banner and the datacenter Notes
    cmds:
      - ansible-playbook -i inventory site.yml --tags hardware-notes

  apply:
    desc: Apply standalone PVE host configuration (operator initiated)
    cmds:
      - ansible-playbook -i inventory site.yml

  reboot:
    desc: Reboot standalone host and wait for Proxmox and SSH to return
    cmds:
      - ansible-playbook -i inventory reboot.yml

  shutdown-plan:
    desc: Show registered Proxmox guests without stopping or powering off
    cmds:
      - ansible-playbook -i inventory shutdown.yml --check

  shutdown:
    desc: Gracefully stop all Proxmox guests, then power off the host
    cmds:
      - ansible-playbook -i inventory shutdown.yml
