<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standalone Proxmox VE layout</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 24px; background: #f5f5f5; color: #2d3142; font: 16px system-ui, sans-serif; }
  main { max-width: 900px; margin: auto; }
  h1 { font: 32px Georgia, serif; }
  .diagram { overflow-x: auto; }
  svg { min-width: 840px; width: 100%; height: auto; }
  text { fill: #2d3142; font: 16px system-ui, sans-serif; }
  .detail { fill: #4f5d75; font: 13px ui-monospace, monospace; }
  .node { fill: #f5f5f5; stroke: #4f5d75; stroke-width: 1.5; rx: 6; }
  .focal { stroke: #bf4520; stroke-width: 2; }
  .boundary { fill: none; stroke: #bfc0c0; stroke-width: 1.5; stroke-dasharray: 6 5; rx: 8; }
  .path { fill: none; stroke: #4f5d75; stroke-width: 1.5; }
</style>
</head>
<body>
<main>
<h1>Standalone Proxmox VE host</h1>
<p>Intended storage layout after applying Ansible. GPU passthrough is deferred; neither graphics card is reconfigured by this playbook.</p>
<div class="diagram">
<svg viewBox="0 0 840 420" role="img" aria-labelledby="layout-title layout-desc">
<title id="layout-title">pve-00 standalone host layout</title>
<desc id="layout-desc">Ansible configures one Proxmox host connected to LAN and NAS template and ISO NFS exports, with NVMe fast storage and HDD slow storage; GPU passthrough remains disabled.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#4f5d75"/></marker></defs>
<rect class="boundary" x="272" y="56" width="536" height="312"/>
<text x="292" y="84">pve-00 · Proxmox VE 9</text>
<path class="path" d="M 216 124 H 268" marker-end="url(#arrow)"/>
<path class="path" d="M 216 256 H 268" marker-end="url(#arrow)"/>
<path class="path" d="M 216 352 H 268" marker-end="url(#arrow)"/>
<rect class="node" x="24" y="88" width="192" height="72"/>
<text x="40" y="116">Ansible operator</text><text class="detail" x="40" y="140">SSH alias pve-00</text>
<rect class="node" x="24" y="220" width="192" height="72"/>
<text x="40" y="248">LAN</text><text class="detail" x="40" y="272">nic0 → vmbr0</text>
<rect class="node" x="24" y="316" width="192" height="72"/>
<text x="40" y="344">NAS · 10.0.40.2</text><text class="detail" x="40" y="368">NFS templates + ISO</text>
<rect class="node" x="296" y="112" width="224" height="96"/>
<text x="312" y="144">Fast · Samsung NVMe</text><text class="detail" x="312" y="172">rpool/data · local-nvme</text>
<rect class="node focal" x="544" y="112" width="240" height="96"/>
<text x="560" y="144">Capacity · HGST HDD</text><text class="detail" x="560" y="172">slow pool · local-hdd</text>
<rect class="node" x="296" y="236" width="224" height="96"/>
<text x="312" y="268">GT 710</text><text class="detail" x="312" y="296">unchanged host driver</text>
<rect class="node" x="544" y="236" width="240" height="96"/>
<text x="560" y="268">P2000</text><text class="detail" x="560" y="296">passthrough deferred</text>
</svg>
</div>
</main>
</body>
</html>
